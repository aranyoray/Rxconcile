name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    name: Validate datasets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate bundled datasets
        run: python3 scripts/build_controlled_substances.py --check

  build-test:
    name: Build & test (iOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install tooling
        run: brew install xcodegen swiftlint

      - name: Generate Xcode project
        run: xcodegen generate

      # Build & test first so genuine compile errors surface even if lint complains.
      - name: Build & test
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone 1[0-9]( Pro)?' || echo 'iPhone 15')
          echo "Using simulator: $DEST"
          xcodebuild test \
            -scheme Rxconcile \
            -destination "platform=iOS Simulator,name=$DEST" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Lint
        if: always()
        run: swiftlint lint --reporter github-actions-logging

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
