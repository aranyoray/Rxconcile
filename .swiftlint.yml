# SwiftLint configuration for Rxconcile.
# Runs on macOS CI; see .github/workflows/ci.yml.

included:
  - Sources
  - Tests

excluded:
  - Sources/Rxconcile/Resources

# Rules that tend to be noisy for SwiftUI view code or are stylistic preferences.
disabled_rules:
  - trailing_comma
  - todo
  - multiple_closures_with_trailing_closure

opt_in_rules:
  - empty_count
  - closure_spacing
  - first_where
  - contains_over_first_not_nil
  - redundant_nil_coalescing

line_length:
  warning: 200          # long user-facing copy strings; never fail CI on length
  error: 400
  ignores_comments: true
  ignores_urls: true

nesting:
  type_level: 2         # allow e.g. Service.Dataset.File / Service.Payload.Item

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 500
  error: 800

function_body_length:
  warning: 80
  error: 150

cyclomatic_complexity:
  warning: 15
  error: 25

identifier_name:
  min_length: 1        # allow short names like `r`, `d`, `x`, `y`
  max_length: 50
  excluded: [id, ii, iv, v, r, g, b, d, x, y]

type_name:
  max_length: 50
